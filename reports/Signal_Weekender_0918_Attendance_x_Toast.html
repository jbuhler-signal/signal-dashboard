async function unlock(){
  const err=document.getElementById('err'),btn=document.getElementById('go');
  err.textContent='';btn.disabled=true;btn.textContent='Unlocking…';
  try{
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(document.getElementById('pw').value),{name:'PBKDF2'},false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);

    const html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(e){err.textContent='Incorrect password.';btn.disabled=false;btn.textContent='Unlock';}
}
